<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Strapi Auth Demo</title>
    <link rel="stylesheet" href="./src/login.css">
</head>

<body>
    <div class="speed-lines"></div>
    <div class="speed-lines"></div>
    <div class="speed-lines"></div>

    <div class="container">


        <h2>Login</h2>
        <input type="text" id="login-identifier" placeholder="Email or Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button onclick="loginUser()">Login</button>

        <div class="message" id="message"></div>
        <button style="border: none; background: none; color: white; cursor: pointer;"
            onclick="location.href='./register.html'">Don't have an account?
            Register</button>

    </div>
    <script>
        //after login, redirect to shop.html
        if (localStorage.getItem('token')) {
            window.location.href = './checkout.html';
        }
    </script>
    <script src="./src/auth.js"></script>
</body>

</html>
