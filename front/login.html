<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Strapi Auth Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 69, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .container {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow:
                0 8px 32px 0 rgba(255, 69, 0, 0.2),
                0 0 80px rgba(255, 215, 0, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 420px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4500, #ffd700, #ff4500);
            border-radius: 20px 20px 0 0;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 15px;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #ff4500, #ffd700);
            border-radius: 2px;
        }

        h2:first-of-type {
            margin-top: 0;
        }

        h2:last-of-type {
            margin-top: 40px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            border-color: #ff4500;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
            transform: translateY(-2px);
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 20px 0 10px 0;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff4500 0%, #ff6a33 100%);
            color: white;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #ff6a33 0%, #ff8c00 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 69, 0, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            font-size: 14px;
            color: #ff4444;
            text-align: center;
            border-radius: 8px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            min-height: 20px;
        }

        /* Speed lines decoration */
        .speed-lines {
            position: absolute;
            top: 50%;
            left: -100px;
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 69, 0, 0.5), transparent);
            animation: speedLine 3s linear infinite;
        }

        @keyframes speedLine {
            0% {
                left: -200px;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                left: calc(100% + 200px);
                opacity: 0;
            }
        }

        .speed-lines:nth-child(2) {
            top: 30%;
            animation-delay: 1s;
            animation-duration: 4s;
        }

        .speed-lines:nth-child(3) {
            top: 70%;
            animation-delay: 2s;
            animation-duration: 3.5s;
        }
    </style>
</head>

<body>
    <div class="speed-lines"></div>
    <div class="speed-lines"></div>
    <div class="speed-lines"></div>

    <div class="container">
        <h2>Register</h2>
        <input type="text" id="reg-username" placeholder="Username" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password" required>
        <button onclick="registerUser()">Register</button>

        <h2>Login</h2>
        <input type="text" id="login-identifier" placeholder="Email or Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button onclick="loginUser()">Login</button>

        <div class="message" id="message"></div>
    </div>

    <script src="./src/auth.js"></script>
</body>

</html>
