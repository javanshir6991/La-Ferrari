<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 69, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            padding-bottom: 20px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #ff4500, #ffd700);
            border-radius: 2px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-top: 40px;
        }

        @media (max-width: 968px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 69, 0, 0.2),
                0 0 80px rgba(255, 215, 0, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff4500, #ffd700, #ff4500);
            border-radius: 20px 20px 0 0;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 69, 0, 0.3);
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-items::-webkit-scrollbar {
            width: 8px;
        }

        .cart-items::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .cart-items::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff4500, #ffd700);
            border-radius: 4px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .item-info h3 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .item-info p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .item-price {
            color: #ff4500;
            font-size: 20px;
            font-weight: 700;
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        textarea {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus,
        textarea:focus {
            border-color: #ff4500;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.3);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .summary-section {
            position: sticky;
            top: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-item.total {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            padding-top: 20px;
            margin-top: 10px;
            border-top: 2px solid rgba(255, 69, 0, 0.5);
            border-bottom: none;
        }

        .summary-item.total .amount {
            color: #ff4500;
        }

        .checkout-btn {
            width: 100%;
            padding: 18px;
            margin-top: 25px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff4500 0%, #ff6a33 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .return-btn {
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3333ff 0%, #33aaff 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(51, 170, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .return-btn:hover {
            background: linear-gradient(135deg, #33aaff 0%, #3333ff 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(51, 170, 255, 0.6);
            transition: all 0.3s ease;
        }

        .checkout-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .checkout-btn:hover::before {
            left: 100%;
        }

        .checkout-btn:hover {
            background: linear-gradient(135deg, #ff6a33 0%, #ff8c00 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 69, 0, 0.6);
        }

        .checkout-btn:active {
            transform: translateY(-1px);
        }

        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(26, 26, 46, 0.98);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 69, 0, 0.4);
            border: 2px solid #ff4500;
            text-align: center;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .success-message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .success-message h2 {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 20px;
            border: none;
        }

        .success-message p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            margin-bottom: 30px;
        }

        .order-details {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .order-details h3 {
            color: #ff4500;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            font-weight: 600;
            color: #ffffff;
        }

        .close-btn {
            background: #ff4500;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ff6a33;
            transform: translateY(-2px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Checkout</h1>

        <div class="checkout-grid">
            <div>
                <div class="section">
                    <h2>Your Cart</h2>
                    <div class="cart-items" id="cartItems">
                        <div class="empty-cart">Your cart is empty</div>
                    </div>
                </div>

                <div class="section" style="margin-top: 30px;">
                    <h2>Shipping Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="john.doe@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="+1 (555) 123-4567" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="123 Main Street" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" placeholder="New York" required>
                        </div>
                        <div class="form-group">
                            <label>Zip Code</label>
                            <input type="text" id="zipCode" placeholder="10001" required>
                        </div>
                    </div>
                </div>

                <div class="section" style="margin-top: 30px;">
                    <h2>Payment Information</h2>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Additional Notes (Optional)</label>
                        <textarea id="notes" placeholder="Any special instructions or comments..."></textarea>
                    </div>
                </div>
            </div>

            <div class="summary-section">
                <div class="section">
                    <h2>Order Summary</h2>
                    <div class="summary-item">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Shipping</span>
                        <span id="shipping">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Tax (10%)</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-item total">
                        <span>Total</span>
                        <span class="amount" id="total">$0.00</span>
                    </div>
                    <button class="checkout-btn" onclick="completeOrder()">Complete Order</button>
                </div>
                <a href="./shop.html"><button class="return-btn">Return to Shop</button></a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="success-message" id="successMessage">
        <h2>✓ Order Confirmed!</h2>
        <p>Your order has been successfully placed.</p>
        <div class="order-details" id="orderDetails"></div>
        <button class="close-btn" onclick="closeSuccess()">Close</button>
    </div>

    <script>
        // Load cart from localStorage
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const cartItems = document.getElementById('cartItems');

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                return;
            }

            cartItems.innerHTML = '';
            cart.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';

                const price = parseFloat(item.price.replace(/[^0-9.-]+/g, "")) || 0; // '298.400 $' kimi format üçün
                const quantity = parseInt(item.count) || 1;

                itemDiv.innerHTML = `
            <div class="item-info" style="display:flex; align-items:center; gap:10px;">
                <img src="${item.image || 'https://via.placeholder.com/60'}" alt="${item.title || 'Product'}" style="width:60px; height:60px; object-fit:cover; border-radius:8px;">
                <div>
                    <h3>${item.title || 'Product'}</h3>
                    <p>Quantity: ${quantity}</p>
                </div>
            </div>
            <div class="item-price">$${(price * quantity).toFixed(2)}</div>
        `;
                cartItems.appendChild(itemDiv);
            });

            calculateTotals(cart);
        }

        function calculateTotals(cart) {
            const subtotal = cart.reduce((sum, item) => {
                const price = parseFloat(item.price.replace(/[^0-9.-]+/g, "")) || 0;
                const quantity = parseInt(item.count) || 1;
                return sum + (price * quantity);
            }, 0);
            const shipping = subtotal > 0 ? 15.00 : 0;
            const tax = subtotal * 0.10;
            const total = subtotal + shipping + tax;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }


        // Format card number with spaces
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
        });

        // Format expiry date
        document.getElementById('expiryDate').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value;
        });

        // Only allow numbers in CVV
        document.getElementById('cvv').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        function completeOrder() {
            // Validate form
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const zipCode = document.getElementById('zipCode').value.trim();
            const cardNumber = document.getElementById('cardNumber').value.trim();
            const expiryDate = document.getElementById('expiryDate').value.trim();
            const cvv = document.getElementById('cvv').value.trim();

            if (!firstName || !lastName || !email || !phone || !address || !city || !zipCode || !cardNumber || !expiryDate || !cvv) {
                alert('Please fill in all required fields!');
                return;
            }

            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const notes = document.getElementById('notes').value.trim();
            const total = document.getElementById('total').textContent;

            // Create order object
            const order = {
                orderNumber: 'ORD-' + Date.now(),
                date: new Date().toLocaleDateString(),
                customer: {
                    firstName,
                    lastName,
                    email,
                    phone,
                    address,
                    city,
                    zipCode
                },
                payment: {
                    cardNumber: '**** **** **** ' + cardNumber.slice(-4),
                    expiryDate
                },
                items: cart,
                total,
                notes
            };

            // Save order to localStorage
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            // Clear cart
            localStorage.removeItem('cart');

            // Show success message
            showSuccessMessage(order);
        }

        function showSuccessMessage(order) {
            const orderDetails = document.getElementById('orderDetails');
            orderDetails.innerHTML = `
                <h3>Order Details</h3>
                <div class="detail-row">
                    <span class="detail-label">Order Number:</span>
                    <span>${order.orderNumber}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Customer:</span>
                    <span>${order.customer.firstName} ${order.customer.lastName}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Email:</span>
                    <span>${order.customer.email}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Shipping Address:</span>
                    <span>${order.customer.address}, ${order.customer.city} ${order.customer.zipCode}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total:</span>
                    <span>${order.total}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Items:</span>
                    <span>${order.items.length}</span>
                </div>
            `;

            document.getElementById('overlay').classList.add('show');
            document.getElementById('successMessage').classList.add('show');
        }

        function closeSuccess() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');

            // Reset form and reload cart
            document.querySelectorAll('input, textarea').forEach(input => input.value = '');
            loadCart();
        }

        // Load cart on page load
        loadCart();
    </script>
</body>

</html>
