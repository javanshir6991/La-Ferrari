<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>La-Ferrari</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

  <link rel="stylesheet" href="./src/style.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body class="bg-black">
  <header>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">

        <div class="swiper-slide"><img src="https://images.hdqwalls.com/download/ferrari-499p-2023-4k-wt-1920x1080.jpg"

        <div class="swiper-slide"><img src="https://images.hdqwalls.com/download/ferrari-499p-2023-10k-kp-1920x1080.jpg"

        <div class="swiper-slide"><img src="https://images.hdqwalls.com/download/2023-ferrari-499p-hw-1920x1080.jpg"

        <div class="swiper-slide"><img src="https://images.hdqwalls.com/download/2023-ferrari-499p-car-ea-1920x1080.jpg"

      </div>


    </div>

    <div class="dark px-15 py-5 flex items-center justify-between" style="font-family: 'SUSE Mono', monospace;">

        <a class="text-white font-semibold text-xl hover:text-yellow-400 hover:scale-110 duration-300"

      </div>

      <div class="buttons text-white text-2xl flex items-center gap-7">
        <button class="hover:text-yellow-400 hover:scale-120 duration-300"><i class="ri-search-line"></i></button>
        <button class="hover:text-yellow-400 hover:scale-120 duration-300"><i
            class="ri-layout-masonry-fill"></i></button>
        <button class="hover:text-yellow-400 hover:scale-120 duration-300"><i class="ri-earth-line"></i></button>
        <button class="hover:text-yellow-400 hover:scale-120 duration-300"><i class="ri-shopping-bag-line"></i></button>

    </div>

  <main>

  </main>
